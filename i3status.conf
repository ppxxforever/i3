# i3status configuration file.
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
        output_format = "i3bar"
        markup = "pango"
        colors = true
        interval = 5
}

order += "wireless _first_"
order += "battery all"
order += "disk /"
order += "load"
order += "memory"
order += "tztime local"

wireless _first_ {
        format_up = "<span size='large'></span> %essid"
        format_down = ""
}

battery all {
        format = "<span size='large'></span> %status %percentage %remaining"
}

disk "/" {
        format = "<span size='large'></span> %avail"
}

load {
        format = "<span size='large'></span> %1min"
}

memory {
        format = "<span size='large'>󰍛</span> %used | %available"
        threshold_degraded = "1G"
        format_degraded = "<span size='large'>󰍛</span> MEMORY &lt; %available"
}

tztime local {
        format = "<span size='large'></span> %Y-%m-%d %H:%M:%S"
}
